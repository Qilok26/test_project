{% extends 'base.html' %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="flex flex-col items-center p-6">
    <h1 class="text-3xl font-bold text-blue-600 mb-4">Contact Me</h1>

    <div class="grid grid-cols-2 gap-6 bg-gray-100 p-6 rounded shadow-md">
        <div>
            <h2 class="font-semibold text-gray-800">Email</h2>
            <p>{{ contacts.email }}</p>
        </div>
        <div>
            <h2 class="font-semibold text-gray-800">GitHub</h2>
            <a href="{{ contacts.github }}" class="text-blue-500 hover:underline">{{ contacts.github }}</a>
        </div>

        {% if contacts.twitter %}
        <div>
            <h2 class="font-semibold text-gray-800">Twitter(X)</h2>
            <a href="{{ contacts.twitter }}" class="text-blue-400 hover:underline">{{ contacts.twitter }}</a>
        </div>
        {% else %}
        <div class="col-span-2 text-red-500 font-semibold">Twitter(X) handle not available.</div>
        {% endif %}
    </div>
</div>
{% endblock %}
