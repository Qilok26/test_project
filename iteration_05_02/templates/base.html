<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Flask UI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <nav class="flex justify-between items-center px-8 py-4 bg-blue-600 text-white shadow">
        <div class="text-2xl font-bold">My Flask Site</div>
        <div class="space-x-6">
            <a href="/" class="hover:text-blue-200 transition">Home</a>
            <a href="/contact" class="hover:text-blue-200 transition">Contact</a>
            <a href="/about" class="hover:text-blue-200 transition">About</a>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto p-8">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center py-4 text-gray-500 mt-10 border-t">
        © 2025 Flask App | Built with Flask & Tailwind CSS
    </footer>

</body>
</html>
